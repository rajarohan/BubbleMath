<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Math Bubbles — Basic Expression Game</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="game-wrap">
      <header class="hud">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="level">Level: <span id="level">1</span></div>
        <button id="resetBtn" class="game-btn reset-btn">Reset Game</button>
      </header>

      <nav class="nav-section">
        <div class="nav-content">
          <div class="nav-line">Math Bubbles</div>
          <div class="nav-line small">Click in order: Lowest → Middle → Highest</div>
        </div>
      </nav>

      <div class="timer-section">
        <div class="time-left">Time: <span id="time">15.0</span>s</div>
        <div class="timer-bar-wrap">
          <div id="timerBar" class="timer-bar"></div>
        </div>
      </div>

      <main class="stage">
        <div id="startScreen" class="start-screen">
          <div class="start-content">
            <h2>Ready to Play?</h2>
            <p>Click bubbles in order: Lowest → Middle → Highest</p>
            <button id="startBtn" class="game-btn start-btn">Start Game</button>
          </div>
        </div>
        
        <div id="bubbles" class="bubbles">
          <button class="bubble" data-id="0">?</button>
          <button class="bubble" data-id="1">?</button>
          <button class="bubble" data-id="2">?</button>
        </div>
      </main>

      <div id="flash" class="flash"></div>

      <footer class="notes">
        <small>© 2025 rajarohan. All rights reserved.</small>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
